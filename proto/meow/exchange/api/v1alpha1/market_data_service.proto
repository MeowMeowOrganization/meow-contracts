syntax = "proto3";

package meow.exchange.api.v1alpha1;

import "google/protobuf/timestamp.proto";
import "meow/exchange/marketdata/v1alpha1/market_data.proto";
import "meow/exchange/marketdata/v1alpha1/order_book.proto";
import "meow/exchange/marketdata/v1alpha1/statistics.proto";

// Public, read-only market-data queries. Requests deliberately omit account
// identity: these endpoints expose only public market observations.
// Streams are public and read-only. Authentication and private order events
// are owned by the Gateway and Order Service, respectively.
service MarketDataService {
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
  rpc StreamOrderBook(StreamOrderBookRequest) returns (stream StreamOrderBookResponse);
  rpc ListRecentTrades(ListRecentTradesRequest) returns (ListRecentTradesResponse);
  rpc GetTicker(GetTickerRequest) returns (GetTickerResponse);
  rpc ListCandles(ListCandlesRequest) returns (ListCandlesResponse);
  rpc GetStats24h(GetStats24hRequest) returns (GetStats24hResponse);
}

message GetOrderBookRequest {
  string market_id = 1;
  // Must be >0 and <= the service's maximum supported depth.
  uint32 depth = 2;
}

message GetOrderBookResponse {
  meow.exchange.marketdata.v1alpha1.BookSnapshot book = 1;
}

// A reconnect always starts with a new complete snapshot. The client must
// replace its old local book and only then apply subsequent deltas.
message StreamOrderBookRequest {
  string market_id = 1;
  // Exactly the configured durable projection depth. Zero and arbitrary
  // smaller depths are deliberately unsupported by the streaming projector.
  uint32 depth = 2;
}

// The first response MUST be snapshot, followed only by contiguous deltas and
// optional heartbeats. The market_definition_version and market_sequence in
// the book payloads are the authoritative cursor; no Kafka offset is exposed.
message StreamOrderBookResponse {
  oneof event {
    meow.exchange.marketdata.v1alpha1.BookSnapshot snapshot = 1;
    meow.exchange.marketdata.v1alpha1.BookDelta delta = 2;
    StreamOrderBookHeartbeat heartbeat = 3;
  }
}

// Transport keepalive only; does NOT represent a committed matching event
// and must not advance the client's book sequence.
message StreamOrderBookHeartbeat {
  uint64 last_delivered_market_sequence = 1;
}

message ListRecentTradesRequest {
  string market_id = 1;
  // Bounded newest-first result. Zero selects the documented server default.
  uint32 limit = 2;
}

message ListRecentTradesResponse {
  repeated meow.exchange.marketdata.v1alpha1.TradeTick trades = 1;
}

message GetTickerRequest {
  string market_id = 1;
}

message GetTickerResponse {
  meow.exchange.marketdata.v1alpha1.Ticker ticker = 1;
}

message ListCandlesRequest {
  string market_id = 1;
  meow.exchange.marketdata.v1alpha1.CandleInterval interval = 2;
  // Inclusive lower bound and exclusive upper bound, in UTC.
  google.protobuf.Timestamp start_time_inclusive = 3;
  google.protobuf.Timestamp end_time_exclusive = 4;
  // Bounded oldest-first result. Zero selects the documented server default.
  uint32 limit = 5;
  // Opaque stable continuation cursor, supplied by a previous response.
  string page_token = 6;
}

message ListCandlesResponse {
  repeated meow.exchange.marketdata.v1alpha1.Candle candles = 1;
  string next_page_token = 2;
}

message GetStats24hRequest {
  string market_id = 1;
}

message GetStats24hResponse {
  meow.exchange.marketdata.v1alpha1.Stats24h stats = 1;
}
