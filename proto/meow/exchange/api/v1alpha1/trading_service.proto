syntax = "proto3";

package meow.exchange.api.v1alpha1;

import "meow/exchange/order/v1alpha1/order.proto";

service TradingService {
  rpc SubmitLimitOrder(SubmitLimitOrderRequest) returns (SubmitLimitOrderResponse);
}

message SubmitLimitOrderRequest {
  // account_id is deliberately absent.
  // Identity comes from Gateway authentication.
  meow.exchange.order.v1alpha1.LimitOrderSubmission order = 1;
}

message SubmitLimitOrderResponse {
  string order_id = 1;
  meow.exchange.order.v1alpha1.OrderStatus status = 2;
}
