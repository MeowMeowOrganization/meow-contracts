syntax = "proto3";

package meow.exchange.trade.v1alpha1;

import "meow/exchange/order/v1alpha1/order.proto";

// Downstream trade projection contracts.
//
// TradeExecuted is NOT emitted directly by the deterministic matching core.
//
// The canonical matching engine emits:
//
//   meow.exchange.matching.v1alpha1.Execution
//
// inside a:
//
//   meow.exchange.matching.v1alpha1.SequencedMatchingEvent
//
// whose MatchingEventId contains:
//
//   market_id
//   market_sequence
//   event_ordinal
//
// A downstream trade projector converts that canonical execution into this
// richer business/settlement representation.
//
// During projection it may:
//
//   - resolve business-facing market identity;
//   - resolve maker/taker account ownership from Order Service state;
//   - convert PriceTicks into exact price_units;
//   - convert QuantityLots into exact base-asset atoms;
//   - calculate exact quote-asset atoms using configured market scales;
//   - derive a deterministic trade_id from the source MatchingEventId.
//
// No floating-point arithmetic or rounding is permitted during this
// projection.
message TradeExecuted {
  // Deterministic trade identity derived from the canonical matching event
  // identity.
  //
  // It must be stable across replay and must not be randomly generated by a
  // consumer.
  string trade_id = 1;

  // Business-facing market identifier, for example "BTC-USDT".
  //
  // The matching event itself carries the canonical numeric MarketId; the
  // projection resolves that identifier to the business-facing market
  // representation used by Order Service, Accounting, APIs, and read models.
  string market_id = 2;

  string maker_order_id = 3;
  string taker_order_id = 4;

  // Resolved downstream from durable order ownership.
  //
  // Account identity is intentionally absent from the deterministic
  // matching-engine Execution event because it is not required for matching.
  string maker_account_id = 5;
  string taker_account_id = 6;

  // Side of the resting maker order.
  //
  // This can be derived deterministically from the matching Execution's
  // taker/aggressor side.
  meow.exchange.order.v1alpha1.OrderSide maker_side = 7;

  // Exact execution price expressed in the business-domain price_units
  // representation.
  //
  // Derived exactly from the matching event's price_ticks and the market's
  // configured price_tick_units.
  uint64 price_units = 8;

  // Exact executed base quantity expressed in base-asset atoms.
  //
  // Derived exactly from quantity_lots and the configured
  // quantity_step_base_atoms.
  uint64 base_quantity_atoms = 9;

  // Exact executed quote quantity expressed in quote-asset atoms.
  //
  // Calculated once by the deterministic projection using the configured
  // market scales and checked integer arithmetic. No rounding or
  // floating-point arithmetic is permitted.
  //
  // Accounting consumes this value rather than independently recomputing
  // decimal price x quantity.
  uint64 quote_quantity_atoms = 10;

  // Source matching event's MatchingEventId.market_sequence.
  //
  // The field name is retained from the original v1alpha1 contract for wire
  // and source compatibility. It represents MarketSequence, not an
  // independent trade sequence and not a Kafka offset.
  uint64 match_sequence = 11;

  // Source matching event's MatchingEventId.event_ordinal.
  //
  // A single matching command may execute against multiple resting orders,
  // producing multiple Execution events with the same market_sequence.
  // event_ordinal distinguishes those executions deterministically.
  //
  // Together with the source market identity:
  //
  //   (market_id, match_sequence, event_ordinal)
  //
  // identifies the canonical matching event from which this trade was
  // projected.
  uint64 event_ordinal = 12;
}
