syntax = "proto3";

package meow.exchange.order.v1alpha1;

// Order lifecycle projection contracts.
//
// These messages are owned by the Order Service domain. They describe
// durable/order-facing lifecycle state derived by the Order Service from
// admission decisions and committed matching results.
//
// They are NOT the canonical events emitted by the deterministic matching
// engine.
//
// Canonical matching-engine output is defined under:
//
//  meow.exchange.matching.v1alpha1
//
// In particular, the matching engine emits deterministic events such as:
//
//  Execution
//  OrderRejected
//  OrderCancelled
//  CancelRejected
//
// inside a MatchingResult. The Order Service consumes those results and
// projects them into lifecycle states such as OPEN, PARTIALLY_FILLED,
// FILLED or REJECTED.
//
// A lifecycle event therefore represents an Order Service projection, not
// an instruction to reconstruct matching-engine state.

enum MatchRejectReason {
  MATCH_REJECT_REASON_UNSPECIFIED = 0;
  MATCH_REJECT_REASON_INVALID_ORDER = 1;
  MATCH_REJECT_REASON_DUPLICATE_ORDER = 2;
  MATCH_REJECT_REASON_MARKET_NOT_ACTIVE = 3;
}

// Projection indicating that the order has resting quantity after
// processing.
//
// This may be derived from a MatchingResult containing zero matching events.
// A zero-event matching result can still change matching-engine state by
// inserting the order into the book.
message OrderOpened {
  uint64 remaining_base_atoms = 1;
}

// Projection indicating that the order has executed some, but not all, of
// its admitted quantity.
//
// last_trade_id identifies the most recent deterministic trade projection
// associated with the lifecycle transition.
message OrderPartiallyFilled {
  uint64 cumulative_filled_base_atoms = 1;
  uint64 remaining_base_atoms = 2;
  string last_trade_id = 3;
}

// Projection indicating that the order has executed its complete admitted
// quantity.
message OrderFilled {
  uint64 cumulative_filled_base_atoms = 1;
  string last_trade_id = 2;
}

// Order Service lifecycle projection for an order that ended in a rejected
// state.
//
// This message is not equivalent to a fatal matching-engine error.
// Business-level matching rejection is a committed deterministic outcome;
// fatal matching-engine errors are never projected as normal lifecycle
// events.
message OrderRejected {
  MatchRejectReason reason = 1;

  // Diagnostic only. Consumers must not branch on this string.
  string message = 2;
}

// Order Service-owned lifecycle projection.
//
// The Order Service creates this projection after applying an admission
// decision or a committed
//  meow.exchange.matching.v1alpha1.MatchingResult.
//
// `market_sequence` identifies the committed per-market matching command
// whose result caused this lifecycle transition when the transition originated
// from matching.
//
// `market_sequence` is semantic matching order, not a Kafka offset and not a
// wall-clock timestamp.
message OrderLifecycleEvent {
  // Business-facing market identifier, for example "BTC-USDT".
  string market_id = 1;

  // Canonical Order Service order identifier.
  string order_id = 2;

  // `MatchingResult.market_sequence` when this lifecycle transition is derived
  // from the matching stream.
  uint64 market_sequence = 3;

  oneof payload {
    OrderOpened opened = 10;
    OrderPartiallyFilled partially_filled = 11;
    OrderFilled filled = 12;
    OrderRejected rejected = 13;
  }
}

// Do not use this message for new code.
//
// It must not be published as matching-engine output. New matching output is
// meow.exchange.matching.v1alpha1.MatchingResult, while Order Service
// lifecycle projections should use OrderLifecycleEvent above.
message MatchingOrderEvent {
  option deprecated = true;

  string market_id = 1;
  string order_id = 2;

  // Legacy field name. New OrderLifecycleEvent uses market_sequence.
  uint64 engine_sequence = 3;

  oneof payload {
    OrderOpened opened = 10;
    OrderPartiallyFilled partially_filled = 11;
    OrderFilled filled = 12;
    OrderRejected rejected = 13;
  }
}
