syntax = "proto3";

package meow.exchange.internal.accounting.v1alpha1;

import "meow/exchange/accounting/v1alpha1/accounting.proto";
import "meow/exchange/common/v1alpha1/types.proto";

service AccountingService {
  rpc ReserveFunds(ReserveFundsRequest) returns (ReserveFundsResponse);

  rpc SettleTrade(SettleTradeRequest) returns (SettleTradeResponse);

  rpc ReleaseReservation(ReleaseReservationRequest) returns (ReleaseReservationResponse);
}

message ReserveFundsRequest {
  // Caller-generated idempotency key.
  string operation_id = 1;

  string account_id = 2;

  meow.exchange.common.v1alpha1.AssetAmount amount = 3;

  // Initially the order_id.
  string reference_id = 4;
}

message ReserveFundsResponse {
  meow.exchange.accounting.v1alpha1.Reservation reservation = 1;
}

message SettleTradeRequest {
  // For this operation, use the deterministic trade_id.
  string operation_id = 1;

  string trade_id = 2;
  string market_id = 3;

  string buyer_account_id = 4;
  string buyer_order_id = 5;
  string buyer_reservation_id = 6;

  string seller_account_id = 7;
  string seller_order_id = 8;
  string seller_reservation_id = 9;

  meow.exchange.common.v1alpha1.AssetAmount base_amount = 10;
  meow.exchange.common.v1alpha1.AssetAmount quote_amount = 11;
}

message SettleTradeResponse {
  meow.exchange.accounting.v1alpha1.Settlement settlement = 1;
}

message ReleaseReservationRequest {
  string operation_id = 1;
  string reservation_id = 2;
}

message ReleaseReservationResponse {
  meow.exchange.accounting.v1alpha1.Reservation reservation = 1;
}
