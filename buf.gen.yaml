version: v2

clean: true

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/MeowMeowOrganization/meow-contracts/gen/go

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go
    opt:
      - paths=source_relative
  
  - remote: buf.build/connectrpc/go:v1.18.1
    out: gen/go
    opt:
      - paths=source_relative
  
  - remote: buf.build/bufbuild/es:v2.12.1
    out: gen/ts
    opt:
      - target=ts
  
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: gen/rust
  
  - remote: buf.build/community/neoeinstein-prost-crate:v0.5.0
    out: gen/rust
    opt:
      - include_file=mod.rs
      - no_features